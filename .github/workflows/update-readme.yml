name: Update README

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# LeetHub pushes several commits in a row; only the newest run needs to finish.
concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for LeetHub to finish pushing
        run: sleep 30

      - name: Rebuild README and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/update_readme.py
            git add README.md topics.json
            if git diff --cached --quiet; then
              echo "README already up to date."
              exit 0
            fi
            git commit -m "docs: auto-update README"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (new commits arrived), retrying..."
            sleep 10
          done
          exit 1
